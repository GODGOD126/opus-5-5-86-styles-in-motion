<script id="style-data" type="application/json">[{"id": 1, "name": "Flat-Vector Science", "family": "Popular Explainer Looks", "description": "Flat-vector science-explainer illustration: deep navy-to-violet space gradients, chunky outline-free shapes with rich multi-stop gradients, flat crescent shadows and rim highlights, soft radial glows, sparkly star fields, banded ringed planets and cute big-eyed round characters.", "image": "posters/001.jpg", "nameZh": "扁平矢量科普", "familyZh": "经典讲解", "explainer": "videos/001-explainer.mp4", "styleClip": "videos/001-style-clip.mp4"}, {"id": 2, "name": "Watercolor Wash", "family": "Painterly", "description": "Transparent pigment glazed in dozens of ragged low-opacity layers on cold-press paper: dark pooled edges, wet-in-wet bleeds, cauliflower blooms, granulation and untouched white paper for the lights, over a faint pencil sketch.", "image": "posters/002.jpg", "nameZh": "水彩晕染", "familyZh": "绘画质感", "explainer": "videos/002-explainer.mp4", "styleClip": "videos/002-style-clip.mp4"}, {"id": 3, "name": "Shadow Puppet Theatre", "family": "Paper & Craft", "description": "Black cut-out silhouettes with punched lace-like cut-work, pinned joints and thin control rods, pressed against a backlit cloth screen glowing amber at the lamp and falling to red-brown at the edges, with coloured gels in the openings.", "image": "posters/003.jpg", "nameZh": "皮影剧场", "familyZh": "纸艺与手工", "explainer": "videos/003-explainer.mp4", "styleClip": "videos/003-style-clip.mp4"}, {"id": 4, "name": "Whiteboard Explainer", "family": "Hand-Drawn", "description": "Dry-erase marker on a glossy whiteboard: streaky chisel-tip strokes with pooled edges, wobbly double-traced boxes and arrows, a ghost of the last erased lesson, and a soft ceiling-light sheen.", "image": "posters/004.jpg", "nameZh": "白板讲解", "familyZh": "手绘", "explainer": "videos/004-explainer.mp4", "styleClip": "videos/004-style-clip.mp4"}, {"id": 5, "name": "Psychedelic Poster", "family": "Cosmic & Psychedelic", "description": "1960s San Francisco concert-poster psychedelia: full-strength inks in vibrating complementary pairs, liquid churning ring bands, sunbursts and a mirror-symmetric eye-flower, with bulbous melting Shrikhand lettering on worn poster stock.", "image": "posters/005.jpg", "nameZh": "迷幻海报", "familyZh": "宇宙与迷幻", "explainer": "videos/005-explainer.mp4", "styleClip": "videos/005-style-clip.mp4"}, {"id": 6, "name": "Tech Glow Explainer", "family": "Popular Explainer Looks", "description": "The polished AI / tech YouTube motion-graphics look: deep navy-to-indigo space with drifting electric glows and a perspective grid, gradient-stroked icon tiles wired into node diagrams with light pulses racing along the connectors, dark cards with thin neon borders, gradient headline type and bloom on everything bright.", "image": "posters/006.jpg", "nameZh": "科技辉光讲解", "familyZh": "经典讲解", "explainer": "videos/006-explainer.mp4", "styleClip": "videos/006-style-clip.mp4"}, {"id": 7, "name": "Papercraft Models", "family": "Popular Explainer Looks", "description": "Printed-cardstock kit models: boxy low-poly robots, cats and charts assembled from flat printed faces with dotted fold lines, glue tabs and hairline seam gaps, Lambert-lit by a warm key light on a green self-healing cutting mat with craft tools at the edges.", "image": "posters/007.jpg", "nameZh": "纸艺模型", "familyZh": "经典讲解", "explainer": "videos/007-explainer.mp4", "styleClip": "videos/007-style-clip.mp4"}, {"id": 8, "name": "1940s Film Noir", "family": "Light & Imaging", "description": "A high-contrast black-and-white still from a forties detective picture: venetian-blind light slicing across a fedora silhouette, a glowing terminal as the only other light, cigarette smoke hanging in the beams, with heavy nitrate grain, gate weave, dust and scratches.", "image": "posters/008.jpg", "nameZh": "1940年代黑色电影", "familyZh": "光影与成像", "explainer": "videos/008-explainer.mp4", "styleClip": "videos/008-style-clip.mp4"}, {"id": 9, "name": "Manim-Style Math", "family": "Popular Explainer Looks", "description": "The math-explainer look of Manim, the open-source library behind 3Blue1Brown: pure black, crisp anti-aliased vector lines, a restrained palette of Manim blue, teal, yellow, red and green, LaTeX-like serif math with italic variables, axes with tick marks, curves, arrows, braces and surrounding rectangles.", "image": "posters/009.jpg", "nameZh": "Manim 数学动画", "familyZh": "经典讲解", "explainer": "videos/009-explainer.mp4", "styleClip": "videos/009-style-clip.mp4"}, {"id": 10, "name": "Illuminated Manuscript", "family": "Illustration", "description": "A Book of Hours folio: mottled vellum with ruling and pricking, textura in iron-gall ink with vermilion rubrics, a historiated initial on raised burnished gold, lapis, rose and malachite with white-lead filigree, ivy-leaf rinceaux with gold bezants, and drolleries in the margins.", "image": "posters/010.jpg", "nameZh": "彩饰手抄本", "familyZh": "插画", "explainer": "videos/010-explainer.mp4", "styleClip": "videos/010-style-clip.mp4"}, {"id": 11, "name": "Editorial Essay Collage", "family": "Popular Explainer Looks", "description": "The editorial \"animated essay\" collage: warm grainy paper, archival halftone prints with torn white borders and soft shadows, newspaper clippings in serif type with a translucent yellow highlighter sweep, masking tape, flat colour blocks and big cut-out condensed headlines.", "image": "posters/011.jpg", "nameZh": "社论拼贴", "familyZh": "经典讲解", "explainer": "videos/011-explainer.mp4", "styleClip": "videos/011-style-clip.mp4"}, {"id": 12, "name": "Bioluminescent Deep Sea", "family": "Light & Imaging", "description": "The midnight zone: near-black water with parallax marine snow, and nothing lit but living light — a jellyfish whose nerve net glows like a neural network, a siphonophore chain, a rainbow-rippling comb jelly and an anglerfish lure. Additive cyan, teal and electric-blue glow with magenta and amber accents; type is bioluminescent.", "image": "posters/012.jpg", "nameZh": "深海生物荧光", "familyZh": "光影与成像", "explainer": "videos/012-explainer.mp4", "styleClip": "videos/012-style-clip.mp4"}, {"id": 13, "name": "Product Launch Reveal", "family": "Popular Explainer Looks", "description": "A big-tech keynote product film: one glossy hero object on a near-black stage, lit like a studio shot with soft key, rim light, a sweeping specular highlight and a floor reflection, huge tight-tracked sans headlines, gradient key numbers with a soft glow and hairline spec callouts.", "image": "posters/013.jpg", "nameZh": "产品发布揭幕", "familyZh": "经典讲解", "explainer": "videos/013-explainer.mp4", "styleClip": "videos/013-style-clip.mp4"}, {"id": 14, "name": "Halftone Pop Panel", "family": "Print", "description": "A Lichtenstein-style blown-up comic panel: fat tapering black brush outlines, mechanical Ben-Day dot fields in red and blue, flat primary yellow, a tearful close-up and hand-lettered balloon.", "image": "posters/014.jpg", "nameZh": "半色调波普", "familyZh": "印刷质感", "explainer": "videos/014-explainer.mp4", "styleClip": "videos/014-style-clip.mp4"}, {"id": 15, "name": "Isometric Pastel", "family": "Dimensional", "description": "Clean vector isometric illustration: true 30° projection, flat three-tone face shading, soft pastel palette with a single coral accent, tiny people for scale and long soft shadows on a floating tile.", "image": "posters/015.jpg", "nameZh": "等距粉彩", "familyZh": "立体空间", "explainer": "videos/015-explainer.mp4", "styleClip": "videos/015-style-clip.mp4"}, {"id": 16, "name": "Oscilloscope Vector Art", "family": "Retro Digital", "description": "Oscilloscope-music XY art on an analogue lab scope: one P31 green beam draws everything, bright where it slows at turns and dim on fast retrace lines, with bloom and halation behind an internal 8x10 graticule, framed by a moulded CRT bezel and a knobbed instrument front panel.", "image": "posters/016.jpg", "nameZh": "示波器矢量艺术", "familyZh": "复古数字", "explainer": "videos/016-explainer.mp4", "styleClip": "videos/016-style-clip.mp4"}, {"id": 17, "name": "Risograph Zine", "family": "Print", "description": "Three fluorescent spot inks (pink, medium blue, yellow) laid down as separate drum passes and multiplied on off-white stock — misregistered plates, grainy patchy solids, dotted tints and roller streaks.", "image": "posters/017.jpg", "nameZh": "孔版印刷小志", "familyZh": "印刷质感", "explainer": "videos/017-explainer.mp4", "styleClip": "videos/017-style-clip.mp4"}, {"id": 18, "name": "Claymation Set", "family": "Paper & Craft", "description": "A plasticine stop-motion still: chunky hand-squished characters and props with soft waxy subsurface shading, thumbprints, tool marks and lumpy silhouettes on a sculpted clay set, shot with shallow depth of field.", "image": "posters/018.jpg", "nameZh": "黏土定格布景", "familyZh": "纸艺与手工", "explainer": "videos/018-explainer.mp4", "styleClip": "videos/018-style-clip.mp4"}, {"id": 19, "name": "Neon Sign at Night", "family": "Light & Imaging", "description": "Hand-bent glass neon on an old brick wall after rain: white-hot tube cores, saturated colour halos, painted-out blockout tube, clips and electrodes, light spilling across the brickwork and smearing in the wet pavement.", "image": "posters/019.jpg", "nameZh": "夜色霓虹招牌", "familyZh": "光影与成像", "explainer": "videos/019-explainer.mp4", "styleClip": "videos/019-style-clip.mp4"}, {"id": 20, "name": "Kawaii Anime", "family": "Popular Explainer Looks", "description": "Flat 2D kawaii anime illustration: chibi characters with big glossy anime eyes and blush marks, chunky rounded shapes in strawberry-milk pink, mint, butter, lavender and sky, soft plum outlines of even weight, one cel-shadow tone and a small highlight, on polka-dot and star patterns.", "image": "posters/020.jpg", "nameZh": "可爱动漫", "familyZh": "经典讲解", "explainer": "videos/020-explainer.mp4", "styleClip": "videos/020-style-clip.mp4"}, {"id": 21, "name": "Ukiyo-e Woodblock", "family": "Art & Design Movements", "description": "An Edo-period woodblock print in the manner of Hokusai: Prussian-blue bokashi gradients, a towering wave with claw-like foam whose spray breaks into data cubes, a cargo ship stacked with server racks in the trough, flat colour blocks with carved keyblock outlines, wood grain and washi fibre, a vertical-text cartouche and vermilion seal.", "image": "posters/021.jpg", "nameZh": "浮世绘木版画", "familyZh": "艺术与设计流派", "explainer": "videos/021-explainer.mp4", "styleClip": "videos/021-style-clip.mp4"}, {"id": 22, "name": "16-Bit Pixel Odyssey", "family": "Retro Digital", "description": "A SNES-era cutscene: 320x180 hand-placed pixels blown up 4x, a strict ~40-colour palette, banded sky with checkerboard dither transitions, layered parallax and an RPG dialog box.", "image": "posters/022.jpg", "nameZh": "16位像素奇旅", "familyZh": "复古数字", "explainer": "videos/022-explainer.mp4", "styleClip": "videos/022-style-clip.mp4"}, {"id": 23, "name": "Chalkboard Lesson", "family": "Hand-Drawn", "description": "Dusty chalk on a green slate: grainy, broken strokes that skip over the board tooth, colored chalk accents, cloudy eraser smears from past lessons, and a worn oak frame with a dusty chalk tray.", "image": "posters/023.jpg", "nameZh": "黑板课堂", "familyZh": "手绘", "explainer": "videos/023-explainer.mp4", "styleClip": "videos/023-style-clip.mp4"}, {"id": 24, "name": "Cut-Paper Diorama", "family": "Paper & Craft", "description": "A layered cardstock shadow-box: every shape is a separate scissor-cut sheet with fibre texture, a lit paper edge and a soft drop shadow onto the sheet behind it; torn edges show the white core of the paper.", "image": "posters/024.jpg", "nameZh": "剪纸立体景", "familyZh": "纸艺与手工", "explainer": "videos/024-explainer.mp4", "styleClip": "videos/024-style-clip.mp4"}, {"id": 25, "name": "Cathedral Glass", "family": "Painterly", "description": "A leaded Gothic window: hand-cut pieces of streaky, seedy antique glass held in thick dark came, painte e-clip.mp4"}, {"id": 82, "name": "ASCII Demoscene", "family": "Retro Digital", "description": "A ray-marched 3D torus rasterised into a strict monospace character grid via a luminance ramp, colour-coded like a 90s demoscene intro: box-drawn title panel, plasma backdrop, copper bars and a sine scroller.", "image": "posters/082.jpg", "nameZh": "ASCII 字符演示艺术", "familyZh": "复古数字", "explainer": "videos/082-explainer.mp4", "styleClip": "videos/082-style-clip.mp4"}, {"id": 83, "name": "International Typographic Style", "family": "Art & Design Movements", "description": "A 1960s Zürich-school concert-style poster: strict 12-column modular grid, enormous flush-left grotesk set tight, an asymmetric field of rotating concentric arc segments over a red disc, and small precise info blocks hung from the grid — red, black and white only.", "image": "posters/083.jpg", "nameZh": "国际主义字体设计", "familyZh": "艺术与设计流派", "explainer": "videos/083-explainer.mp4", "styleClip": "videos/083-style-clip.mp4"}, {"id": 84, "name": "Flow Field", "family": "Data & Information", "description": "Thousands of hairline streamlines traced through a curl-noise field that parts around an unseen core; additive colour from a refined gradient builds luminous braids on dark paper.", "image": "posters/084.jpg", "nameZh": "流场", "familyZh": "数据与信息", "explainer": "videos/084-explainer.mp4", "styleClip": "videos/084-style-clip.mp4"}, {"id": 85, "name": "MacPaint 1984", "family": "Retro Digital", "description": "Pure 1-bit black & white at the original 72-dpi grain: real Atkinson-dithered grayscale (blown-out highlights, crunchy shadows), 8x8 fill patterns, striped title bars, marching ants and bitmap type.", "image": "posters/085.jpg", "nameZh": "MacPaint 1984 画板", "familyZh": "复古数字", "explainer": "videos/085-explainer.mp4", "styleClip": "videos/085-style-clip.mp4"}, {"id": 86, "name": "Multi-scale Truchet", "family": "Generative & Type", "description": "Bold two-ink multi-scale Truchet tiling of winged quarter-circle tiles whose paths flow continuously across three scales; a third ink fills only the closed regions that fall inside the letters \"AI\", so the word surfaces from the maze.", "image": "posters/086.jpg", "nameZh": "多尺度特鲁歇拼砖", "familyZh": "生成艺术与字体", "explainer": "videos/086-explainer.mp4", "styleClip": "videos/086-style-clip.mp4"}]</script>
<script>
'use strict';
const styles=JSON.parse(document.querySelector('#style-data').textContent);
const grid=document.querySelector('#grid'),search=document.querySelector('#search'),family=document.querySelector('#family'),modal=document.querySelector('#preview'),video=document.querySelector('#example-video'),mode=document.querySelector('#video-mode'),videoStatus=document.querySelector('#video-status');
const COPY='复制名称 / Copy name';
let active=null,noticeTimer,playSequence=0;
const cards=[];
for(const name of [...new Set(styles.map(s=>s.family))]){const option=document.createElement('option');option.value=name;option.textContent=styles.find(s=>s.family===name).familyZh+' / '+name;family.append(option)}
function notice(message){const box=document.querySelector('#notice');box.textContent=message;box.hidden=false;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>box.hidden=true,2600)}
async function copyName(style,button){
 let success=false;
 try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(style.name);success=true}}catch{}
 if(!success){const area=document.createElement('textarea');area.value=style.name;area.setAttribute('aria-label','待复制的风格名称 / Style name');area.style.cssText='position:fixed;left:0;top:0;opacity:0;width:1px;height:1px';(modal.open?modal:document.body).append(area);area.focus();area.select();try{success=document.execCommand('copy')}catch{}area.remove();button.focus()}
 if(success){button.textContent='已复制 / Copied';button.classList.add('done');notice('已复制 / Copied: '+style.name);setTimeout(()=>{button.textContent=COPY;button.classList.remove('done')},1800)}
 else{openPreview(style,false);const field=document.querySelector('#manual');document.querySelector('#manual-wrap').hidden=false;field.value=style.name;field.focus();field.select()}
}
function playExample(){
 if(!active)return;
 const sequence=++playSequence;video.pause();videoStatus.textContent='';video.poster=active.image;video.src=active[mode.value];video.load();
 const pending=video.play();if(pending)pending.catch(error=>{if(sequence!==playSequence||!modal.open)return;videoStatus.textContent=error.name==='NotAllowedError'?'请点击视频播放按钮 / Click the video play button.':'视频暂时无法播放，请重试 / Unable to play. Please try again.'});
}
function openPreview(style,autoplay=true){
 active=style;const title=document.querySelector('#large-title');title.replaceChildren(document.createTextNode(style.nameZh));const english=document.createElement('span');english.textContent=style.name;title.append(english);
 document.querySelector('#large-category').textContent='#'+String(style.id).padStart(2,'0')+' · '+style.familyZh+' / '+style.family;
 document.querySelector('#manual-wrap').hidden=true;const copy=document.querySelector('#large-copy');copy.textContent=COPY;copy.classList.remove('done');mode.value='explainer';if(!modal.open)modal.showModal();
 if(autoplay)playExample();else{++playSequence;video.pause();video.poster=style.image;video.src=style.explainer;video.load();videoStatus.textContent=''}
}
function stopExample(){++playSequence;video.pause();video.removeAttribute('src');video.load();videoStatus.textContent=''}
for(const style of styles){
 const card=document.createElement('article');card.className='card';card.dataset.styleId=style.id;
 const picture=document.createElement('button');picture.className='picture';picture.type='button';picture.setAttribute('aria-label','播放案例 / Play '+style.nameZh+' / '+style.name);
 const img=document.createElement('img');img.src=style.image;img.alt=style.nameZh+' / '+style.name;img.width=800;img.height=450;img.loading=style.id<=6?'eager':'lazy';
 const badge=document.createElement('span');badge.className='play-badge';badge.textContent='▶';badge.setAttribute('aria-hidden','true');picture.append(img,badge);picture.addEventListener('click',()=>openPreview(style));
 const info=document.createElement('div');info.className='card-info';const meta=document.createElement('div');meta.className='meta';const category=document.createElement('p');category.className='category';category.textContent='#'+String(style.id).padStart(2,'0')+' · '+style.familyZh+' / '+style.family;
 const title=document.createElement('h2');title.textContent=style.nameZh;const english=document.createElement('p');english.className='name-en';english.textContent=style.name;meta.append(category,title,english);
 const button=document.createElement('button');button.className='copy';button.type='button';button.textContent=COPY;button.setAttribute('aria-label',COPY+' '+style.name);button.addEventListener('click',()=>copyName(style,button));info.append(meta,button);card.append(picture,info);grid.append(card);
 cards.push({card,style,terms:[String(style.id).padStart(2,'0'),style.nameZh,style.name,style.family,style.familyZh,style.description].join(' ').toLowerCase()})
}
function filter(){const term=search.value.trim().toLowerCase();let count=0;for(const item of cards){const show=(!family.value||item.style.family===family.value)&&(!term||item.terms.includes(term));item.card.hidden=!show;if(show)count++}document.querySelector('#count').textContent=count+' / 86';document.querySelector('#empty').hidden=count>0}
search.addEventListener('input',filter);family.addEventListener('change',filter);mode.addEventListener('change',playExample);
video.addEventListener('playing',()=>videoStatus.textContent='');video.addEventListener('error',()=>{if(modal.open&&video.hasAttribute('src'))videoStatus.textContent='视频加载失败 / Video failed to load.'});
modal.addEventListener('close',stopExample);document.querySelector('#close').addEventListener('click',()=>{stopExample();modal.close()});document.querySelector('#large-copy').addEventListener('click',event=>{if(active)copyName(active,event.currentTarget)});
modal.addEventListener('click',event=>{if(event.target===modal){const bounds=modal.getBoundingClientRect();if(event.clientX<bounds.left||event.clientX>bounds.right||event.clientY<bounds.top||event.clientY>bounds.bottom){stopExample();modal.close()}}});
</script>
</body>
</html>
